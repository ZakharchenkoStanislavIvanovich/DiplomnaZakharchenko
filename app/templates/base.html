<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <title>{% block title %}Нотаріус{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .navbar {
      background-color: #2c3e50 !important;
    }

    /* .navbar {
      background-color: #808000 !important;
    } */

    .navbar-brand {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      text-transform: uppercase;
      font-size: 2rem;
      letter-spacing: 2px;
      color: white !important;
      text-decoration: none;
      transition: opacity 0.3s;
    }

    .navbar-brand:hover {
      opacity: 0.8;
      color: white !important;
    }

    .nav-btn {
      background-color: #343a40;
      color: white !important;
      padding: 8px 20px;
      margin: 0 12px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 500;
      transition: background 0.3s, transform 0.2s;
    }

    .nav-btn:hover {
      background-color: #23272b;
      transform: scale(1.05);
    }

    .btn,
    .btn-primary {
      background-color: #343a40 !important;
      border-color: #343a40 !important;
      color: white !important;
      border-radius: 10px;
      transition: background 0.3s, transform 0.2s;
    }

    .btn:hover,
    .btn-primary:hover {
      background-color: #23272b !important;
      border-color: #23272b !important;
      transform: scale(1.03);
    }
  </style>

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700;900&display=swap" rel="stylesheet">
</head>

<body>

  <nav class="navbar navbar-expand-lg">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('main.index') }}">ТВІЙ НОТАРІУС</a>

      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-btn" href="{{ url_for('appointments.book') }}">Подати заявку на прийом</a>
          </li>
          <li class="nav-item">
            <a class="nav-btn" href="{{ url_for('main.contacts') }}">Контакти</a>
          </li>
          <li class="nav-item">
              <a class="nav-btn" href="{{ url_for('main.services_list') }}">Нотаріальні послуги</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %}{% endblock %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
