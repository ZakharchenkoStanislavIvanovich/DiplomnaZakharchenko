{% extends "base.html" %}

{% block title %}Успішно зареєстровано!{% endblock %}

{% block content %}
<div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 70vh; text-align: center; color: #343a40;">
    <div style="background: #d4edda; color: #155724; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 600px;">
        <i class="fas fa-check-circle" style="font-size: 5rem; margin-bottom: 20px; color: #28a745;"></i>
        <h1 style="font-weight: 700; margin-bottom: 20px;">Успішно!</h1>
        <p style="font-size: 1.3rem; line-height: 1.6;">
            Вашу заявку успішно зареєстровано та передано в систему обробки.<br>
            Ми зв'яжемося з вами за вказаною електронною поштою для підтвердження.
        </p>
        <div style="margin-top: 40px;">
            <a href="{{ url_for('main.index') }}" class="btn btn-primary" style="padding: 12px 30px; font-size: 1.1rem; border-radius: 10px;">
                Повернутися на головну
            </a>
        </div>
    </div>
</div>
{% endblock %}
