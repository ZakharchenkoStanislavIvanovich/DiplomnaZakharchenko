{% extends "base.html" %}
{% block content %}
<div class="container mt-5" style="color: #343a40;">
    <h2 class="mb-4" style="font-weight: 700;">Перелік нотаріальних послуг</h2>
    <div class="list-group">
        {% for service in services %}
        <div id="service-{{ service.id }}" class="list-group-item mb-3 border-0 shadow-sm p-4" style="border-radius: 15px;">
            <h4 style="font-weight: 600;">{{ loop.index }}. {{ service.name }}</h4>
            <p class="text-muted">{{ service.description }}</p>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
