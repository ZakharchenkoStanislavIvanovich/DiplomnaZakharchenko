services:
  db:
    image: postgres:17-alpine
    ports:
      - "5432:5432"
    environment:
      - TZ=Europe/Kyiv
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - notary_network

  backend:
    build: .
    container_name: notary-backend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - TZ=Europe/Kyiv
      - DATABASE_URL=postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      - db
    networks:
      - notary_network
    # logging:
    #   driver: "awslogs"
    #   options:
    #     awslogs-region: "${AWS_REGION}"
    #     awslogs-group: "notary-app-logs"
    #     awslogs-create-group: "true"
    #     tag: "{{.Name}}/{{.ID}}"

networks:
  notary_network:
    name: notary_network
    driver: bridge

volumes:
  postgres_data: